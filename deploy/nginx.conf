server {
    listen 80;
    server_name 10.23.212.47 106.75.224.152;
    # 前端静态页
    location / {
        root /opt/aiops/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
    # ★ 后端 API：proxy_pass 末尾【绝对不能有斜杠】→ /api/auth/login 原样透传给后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
    # Grafana：末尾【要有斜杠】→ 剥掉 /grafana 前缀转发（Grafana 自己加回前缀）
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Prometheus：末尾【不能有斜杠】→ /prometheus/xxx 原样透传
    location /prometheus/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        auth_basic "Prometheus";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    # Loki：原样透传
    location /loki/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }
}
